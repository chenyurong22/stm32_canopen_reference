---
name: CANopen reference validation

"on":
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  CMAKE_PACKAGE_VERSION: 3.28.3-1build7
  ARM_GCC_PACKAGE_VERSION: 15:13.2.rel1-2
  NEWLIB_PACKAGE_VERSION: 4.4.0.20231231-2
  CPPCHECK_PACKAGE_VERSION: 2.13.0-2ubuntu3
  CLANG_FORMAT_PACKAGE_VERSION: 1:18.0-59~exp2
  CLANG_TIDY_PACKAGE_VERSION: 1:18.0-59~exp2
  STM32_CUBE_F7_REV: c2ecfd2d863d4cb1a138e63be4c8c1c4acd43d4d

jobs:
  static-analysis:
    name: Project C static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "cppcheck=${CPPCHECK_PACKAGE_VERSION}"
      - name: Install pinned clang-format
        run: |
          sudo apt-get install --yes --no-install-recommends "clang-format=${CLANG_FORMAT_PACKAGE_VERSION}"
      - name: Check formatted project-owned CiA 302 module
        run: |
          clang-format --dry-run --Werror \
            middleware/canopen/core/cia302_nmt_master.c \
            middleware/canopen/core/cia302_nmt_master.h
      - name: Install pinned clang-tidy
        run: |
          sudo apt-get install --yes --no-install-recommends "clang-tidy=${CLANG_TIDY_PACKAGE_VERSION}"
      - name: Analyze project-owned sources with clang-tidy
        run: |
          clang-tidy \
            App/Src/canopen_reference_can_recovery.c \
            App/Src/canopen_reference_lss.c \
            middleware/canopen/core/cia302_nmt_master.c \
            --config-file=.clang-tidy \
            --warnings-as-errors='' \
            -- \
            -std=c11 -Itests/fakes -IApp/Inc -Imiddleware/canopen/core
      - name: Evaluate compiler hardening flags
        run: scripts/check_compiler_hardening.sh build/hardening/compiler-hardening.json
      - name: Upload static-analysis evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-evidence
          if-no-files-found: error
          path: build/hardening/compiler-hardening.json
      - name: Analyze project-owned C sources
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --std=c11 \
            --error-exitcode=1 \
            --force \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --template=gcc \
            -IApp/Inc \
            -Imiddleware/canopen/port \
            App Core middleware/canopen/port tests

  host-vcan:
    name: Host validation and SocketCAN protocol regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Probe and create vcan0 when supported
        id: vcan
        shell: bash
        run: |
          set -o pipefail
          if ip link show vcan0 >/dev/null 2>&1; then
            sudo ip link set vcan0 up
            echo "available=true" >> "$GITHUB_OUTPUT"
            ip -details link show vcan0
          elif sudo modprobe vcan 2>/dev/null && sudo ip link add dev vcan0 type vcan; then
            sudo ip link set vcan0 up
            echo "available=true" >> "$GITHUB_OUTPUT"
            ip -details link show vcan0
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=SocketCAN vcan unavailable::The hosted kernel does not expose the vcan driver. Runtime wire-level tests are skipped; deterministic OD, Python, and C transport validation still run."
          fi
      - name: Validate Object Dictionary, firmware contracts, and host sources
        run: |
          python3 scripts/validate_repository.py
          python3 scripts/validate_od.py
          python3 scripts/validate_cia418.py
          python3 scripts/validate_inventus_battery.py
          python3 scripts/validate_cia401_product.py
          tools/import_objdict.sh Generated --stage
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile \
            tests/test_firmware_configuration.py \
            tests/host/can_socket.py \
            tests/host/test_sdo.py \
            middleware/canopen/examples/canopen_vcan_device.py \
            tests/test_canopen_wire_contract.py \
            middleware/diagnostics/uds_isotp.py \
            tests/test_uds_isotp.py \
            tests/run_uds_isotp_contract.py \
            scripts/cia418_catalog.py \
            scripts/generate_cia418_od.py \
            scripts/inventus_battery_catalog.py \
            scripts/generate_inventus_battery_od.py \
            scripts/validate_inventus_battery.py \
            scripts/validate_repository.py \
            scripts/validate_cia418.py \
            scripts/validate_cia401_product.py \
            middleware/gateway/nmea2000_gateway.py \
            tests/test_nmea2000_gateway.py \
            tests/run_nmea2000_gateway_contract.py \
            tests/hardware/run_uds_cia302_acceptance.py \
            tests/hardware/run_uds_stm32f767_acceptance.py \
            tests/hardware/run_cia401_hil_campaign.py \
            tests/conformance/run_core_vectors.py \
            scripts/validate_build_manifest.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_firmware_configuration.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_canopen_wire_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/conformance/run_core_vectors.py
          PYTHONPATH=.:tests PYTHONDONTWRITEBYTECODE=1 python3 tests/run_uds_isotp_contract.py
          PYTHONPATH=.:tests PYTHONDONTWRITEBYTECODE=1 python3 tests/run_nmea2000_gateway_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/hardware/run_uds_cia302_acceptance.py --dry-run
          PYTHONDONTWRITEBYTECODE=1 python3 tests/hardware/run_uds_stm32f767_acceptance.py \
            --dry-run \
            --json-out build/hil/uds-stm32f767-acceptance.json \
            --csv-out build/hil/uds-stm32f767-acceptance.csv \
            --report-out build/hil/uds-stm32f767-acceptance.txt
          python3 tests/hardware/run_cia401_hil_campaign.py \
            --dry-run \
            --output build/hil/cia401-hil-pending.json \
            --release-commit "${GITHUB_SHA:-local}" \
            --firmware-sha "not-built-in-host-validation" \
            --board-serial "TBD-HARDWARE" \
            --board-revision "TBD-HARDWARE" \
            --operator "github-actions" \
            --equipment runner=hosted
          mkdir -p build/tests
          gcc -std=c11 -Wall -Wextra -Werror \
            -DCANOPEN_REFERENCE_ENABLE_CIA401=1 \
            -DCANOPEN_REFERENCE_ENABLE_CIA402=1 \
            -DCANOPEN_REFERENCE_ALLOW_COMBINED_PROFILES=1 \
            -Itests/fakes -IApp/Inc \
            tests/test_profiles.c App/Src/cia401_reference.c App/Src/cia402_reference.c \
            -o build/tests/test_profiles
          build/tests/test_profiles
          make -C tests/host all test-stm32-facade test-gateway-default-deny test-inventus-battery test-acceptance-filter test-uds
          make -C tests/host test-sanitize test-coverage
      - name: Run SocketCAN integration tests
        if: steps.vcan.outputs.available == 'true'
        env:
          CAN_PORT_IFACE: vcan0
        run: make -C tests/host test
      - name: Report skipped SocketCAN integration tests
        if: steps.vcan.outputs.available != 'true'
        run: |
          echo "SocketCAN runtime tests require a Linux runner with CONFIG_CAN_VCAN."
          echo "Run 'make -C tests/host test' on a standard Linux host after creating vcan0."

  release-vcan:
    name: Release candidate SocketCAN regression (capability-gated)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc make iproute2 kmod
      - name: Probe and create vcan0 when supported
        id: vcan
        shell: bash
        run: |
          set -o pipefail
          status_file=release-socketcan-status.txt
          if ip link show vcan0 >/dev/null 2>&1; then
            sudo ip link set vcan0 up
            echo "available=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'schema=stm32-canopen-release-socketcan-v1' \
              'status=available' \
              'native_socketcan=scheduled' > "$status_file"
            ip -details link show vcan0
          elif sudo modprobe vcan 2>/dev/null && sudo ip link add dev vcan0 type vcan; then
            sudo ip link set vcan0 up
            echo "available=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'schema=stm32-canopen-release-socketcan-v1' \
              'status=available' \
              'native_socketcan=scheduled' > "$status_file"
            ip -details link show vcan0
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              'schema=stm32-canopen-release-socketcan-v1' \
              'status=unavailable' \
              'native_socketcan=not-executed' \
              'reason=hosted-kernel-does-not-expose-CONFIG_CAN_VCAN' > "$status_file"
            echo "::warning title=Native SocketCAN unavailable::The hosted kernel does not expose vcan; live wire tests are not claimed. The deterministic release regression fallback will run, and the status artifact remains a release-evidence blocker."
          fi
      - name: Run native SocketCAN integration tests
        if: steps.vcan.outputs.available == 'true'
        env:
          CAN_PORT_IFACE: vcan0
        run: |
          set -euo pipefail
          make -C tests/host test
          echo 'native_runtime_tests=passed' >> release-socketcan-status.txt
      - name: Run deterministic release regression when vcan is unavailable
        if: steps.vcan.outputs.available != 'true'
        run: |
          set -euo pipefail
          python3 tests/conformance/run_core_vectors.py
          python3 tests/test_canopen_wire_contract.py
          make -C tests/host all test-stm32-facade test-gateway-default-deny test-sanitize test-coverage test-acceptance-filter
          echo 'deterministic_fallback=passed' >> release-socketcan-status.txt
      - name: Upload SocketCAN validation status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-socketcan-status
          if-no-files-found: error
          path: release-socketcan-status.txt

  cortex-m7-build:
    name: STM32F767 cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned ARM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "cmake=${CMAKE_PACKAGE_VERSION}" \
            "gcc-arm-none-eabi=${ARM_GCC_PACKAGE_VERSION}" \
            "libnewlib-arm-none-eabi=${NEWLIB_PACKAGE_VERSION}" \
            git
      - name: Retrieve pinned STM32CubeF7 headers and HAL
        run: |
          git init third_party/STM32CubeF7
          git -C third_party/STM32CubeF7 remote add origin https://github.com/STMicroelectronics/STM32CubeF7.git
          git -C third_party/STM32CubeF7 fetch --depth 1 origin "$STM32_CUBE_F7_REV"
          git -C third_party/STM32CubeF7 checkout --detach FETCH_HEAD
          git -C third_party/STM32CubeF7 submodule update --init --recursive --depth 1
          test "$(git -C third_party/STM32CubeF7 rev-parse HEAD)" = "$STM32_CUBE_F7_REV"
      - name: Configure and build firmware
        run: |
          cmake -S . -B build/ci-firmware \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_CUBE_F7_DIR="$GITHUB_WORKSPACE/third_party/STM32CubeF7" \
            -DSTM32_F7_LINKER_SCRIPT="$GITHUB_WORKSPACE/linker/STM32F767_2M_512K_FLASH.ld" \
            -DCANOPEN_REFERENCE_PRODUCTION_PROFILE=ON
          cmake --build build/ci-firmware --parallel 2
          arm-none-eabi-size build/ci-firmware/stm32f767_canopen_reference
      - name: Configure and build UDS-enabled diagnostic profile
        run: |
          cmake -S . -B build/ci-uds \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_CUBE_F7_DIR="$GITHUB_WORKSPACE/third_party/STM32CubeF7" \
            -DSTM32_F7_LINKER_SCRIPT="$GITHUB_WORKSPACE/linker/STM32F767_2M_512K_FLASH.ld" \
            -DCANOPEN_REFERENCE_PRODUCTION_PROFILE=ON \
            -DCANOPEN_REFERENCE_ENABLE_UDS=ON
          cmake --build build/ci-uds --parallel 2
          arm-none-eabi-size build/ci-uds/stm32f767_canopen_reference
      - name: Configure and build CiA 402 drive personality
        run: |
          cmake -S . -B build/ci-cia402 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_CUBE_F7_DIR="$GITHUB_WORKSPACE/third_party/STM32CubeF7" \
            -DSTM32_F7_LINKER_SCRIPT="$GITHUB_WORKSPACE/linker/STM32F767_2M_512K_FLASH.ld" \
            -DCANOPEN_REFERENCE_PRODUCTION_PROFILE=ON \
            -DCMAKE_C_FLAGS="-DCANOPEN_REFERENCE_ENABLE_CIA401=0 -DCANOPEN_REFERENCE_ENABLE_CIA402=1"
          cmake --build build/ci-cia402 --parallel 2
          arm-none-eabi-size build/ci-cia402/stm32f767_canopen_reference
      - name: Configure and build optional CiA 418 live-OD personality
        run: |
          cmake -S . -B build/ci-cia418 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_CUBE_F7_DIR="$GITHUB_WORKSPACE/third_party/STM32CubeF7" \
            -DSTM32_F7_LINKER_SCRIPT="$GITHUB_WORKSPACE/linker/STM32F767_2M_512K_FLASH.ld" \
            -DCANOPEN_REFERENCE_PRODUCTION_PROFILE=ON \
            -DCANOPEN_REFERENCE_ENABLE_CIA418=ON
          cmake --build build/ci-cia418 --parallel 2
          arm-none-eabi-size build/ci-cia418/stm32f767_canopen_reference
      - name: Configure and build optional Inventus battery test personality
        run: |
          cmake -S . -B build/ci-inventus-battery \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_CUBE_F7_DIR="$GITHUB_WORKSPACE/third_party/STM32CubeF7" \
            -DSTM32_F7_LINKER_SCRIPT="$GITHUB_WORKSPACE/linker/STM32F767_2M_512K_FLASH.ld" \
            -DCANOPEN_REFERENCE_PRODUCTION_PROFILE=ON \
            -DCANOPEN_REFERENCE_ENABLE_INVENTUS_BATTERY=ON
          cmake --build build/ci-inventus-battery --parallel 2
          arm-none-eabi-size build/ci-inventus-battery/stm32f767_canopen_reference

      - name: Configure and build optional CiA 302 master personality
        run: |
          cmake -S . -B build/ci-cia302 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_CUBE_F7_DIR="$GITHUB_WORKSPACE/third_party/STM32CubeF7" \
            -DSTM32_F7_LINKER_SCRIPT="$GITHUB_WORKSPACE/linker/STM32F767_2M_512K_FLASH.ld" \
            -DCANOPEN_REFERENCE_PRODUCTION_PROFILE=ON \
            -DCANOPEN_REFERENCE_ENABLE_CIA302_MASTER=ON
          cmake --build build/ci-cia302 --parallel 2
          arm-none-eabi-size build/ci-cia302/stm32f767_canopen_reference
      - name: Configure and build optional CiA 309 gateway personality
        run: |
          cmake -S . -B build/ci-gateway \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake \
            -DSTM32_CUBE_F7_DIR="$GITHUB_WORKSPACE/third_party/STM32CubeF7" \
            -DSTM32_F7_LINKER_SCRIPT="$GITHUB_WORKSPACE/linker/STM32F767_2M_512K_FLASH.ld" \
            -DCANOPEN_REFERENCE_PRODUCTION_PROFILE=ON \
            -DCMAKE_C_FLAGS="-DCANOPEN_REFERENCE_ENABLE_GATEWAY=1"
          cmake --build build/ci-gateway --parallel 2
          arm-none-eabi-size build/ci-gateway/stm32f767_canopen_reference
      - name: Record reproducibility manifest
        env:
          CANOPEN_REFERENCE_PERSONALITY: all-ci-personalities
          STM32_F7_LINKER_SCRIPT: ${{ github.workspace }}/linker/STM32F767_2M_512K_FLASH.ld
        run: scripts/write_build_manifest.sh build/ci-build-manifest.txt "$GITHUB_WORKSPACE/third_party/STM32CubeF7"
      - name: Check target memory budget
        env:
          # Explicit application Flash/RAM budgets retain approximately 20%
          # headroom for boot-time growth, diagnostics, and board integration.
          MAX_TEXT_BYTES: 1228800
          MAX_DATA_BYTES: 262144
          MAX_BSS_BYTES: 262144
          MAX_FLASH_LOAD_BYTES: 1228800
          MAX_RAM_BYTES: 409600
        run: scripts/check_memory_budget.sh build/ci-firmware/stm32f767_canopen_reference.map build/memory-budget.json
      - name: Generate host coverage and sanitizer reports
        env:
          COVERAGE_MIN_LINE: 90
          COVERAGE_MIN_FUNCTION: 95
          COVERAGE_MIN_BRANCH: 85
        run: |
          make -C tests/host clean
          make -C tests/host test-coverage-report test-sanitize-report
          mkdir -p build/reports
          cp build/host-coverage/report/coverage-summary.json build/reports/coverage-summary.json
          cp build/host-sanitize/report/sanitizer-report.txt build/reports/sanitizer-report.txt
      - name: Generate software validation JUnit report
        run: |
          mkdir -p build/reports
          python3 scripts/run_validation_junit.py --output build/reports/test-results.xml
      - name: Validate release evidence bundle
        run: python3 scripts/validate_release_artifacts.py .
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32f767-canopen-reference
          if-no-files-found: error
          path: |
            build/ci-build-manifest.txt
            build/ci-build-manifest.json
            build/memory-budget.json
            build/reports/test-results.xml
            build/reports/coverage-summary.json
            build/reports/sanitizer-report.txt
            build/ci-firmware/stm32f767_canopen_reference
            build/ci-firmware/stm32f767_canopen_reference.hex
            build/ci-firmware/stm32f767_canopen_reference.bin
            build/ci-firmware/stm32f767_canopen_reference.map
            build/ci-uds/stm32f767_canopen_reference
            build/ci-uds/stm32f767_canopen_reference.hex
            build/ci-uds/stm32f767_canopen_reference.bin
            build/ci-uds/stm32f767_canopen_reference.map
            build/ci-cia402/stm32f767_canopen_reference
            build/ci-cia402/stm32f767_canopen_reference.hex
            build/ci-cia402/stm32f767_canopen_reference.bin
            build/ci-cia402/stm32f767_canopen_reference.map
            build/ci-cia302/stm32f767_canopen_reference
            build/ci-cia302/stm32f767_canopen_reference.hex
            build/ci-cia302/stm32f767_canopen_reference.bin
            build/ci-cia302/stm32f767_canopen_reference.map
            build/ci-gateway/stm32f767_canopen_reference
            build/ci-gateway/stm32f767_canopen_reference.hex
            build/ci-gateway/stm32f767_canopen_reference.bin
            build/ci-gateway/stm32f767_canopen_reference.map
